name: Fermata MNN conversion
# Developer-side only. Never changes the normal APK or downloads on a phone.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/prepare_fermata_mnn.py'
      - 'scripts/patch_mnn_wheel_execstack.py'
      - 'scripts/test_patch_mnn_wheel_execstack.py'
      - 'scripts/test_fermata_codec_manifest.py'
      - 'scripts/run_fermata_mnn.py'
      - 'scripts/report_fermata_vocabulary.py'
      - 'scripts/fetch_fermata_vocabulary.py'
      - 'native/android/fermata-mnn/**'
      - 'native/android/sonivox/**'
      - '.github/workflows/fermata-mnn.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: soundworld-fermata-conversion
  cancel-in-progress: false
jobs:
  original-tokenizer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Get only the genuine original tokenizer, without the large weights
        run: |
          python -m pip install huggingface_hub
          set -o pipefail
          python scripts/fetch_fermata_vocabulary.py | tee "$RUNNER_TEMP/fermata-vocabulary.txt"
          cat "$RUNNER_TEMP/fermata-vocabulary.txt" >> "$GITHUB_STEP_SUMMARY"
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore exact converted public model files
        id: weights
        uses: actions/cache/restore@v4
        with:
          path: |
            fermata-conversion/mnn
            fermata-conversion/conversion.json
            fermata-conversion/FERMATA_UPSTREAM_README.md
            fermata-conversion/MNN_LICENSE
          key: fermata-int8-18b6470-mnn-3.6.1-${{ hashFiles('scripts/prepare_fermata_mnn.py') }}
      - name: Install official developer-side MNN
        run: python -m pip install 'mnn==3.6.1'
      - name: Fix and verify MNN converter ELF stack metadata
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y patchelf
          python -m unittest scripts.test_patch_mnn_wheel_execstack scripts.test_fermata_codec_manifest
          site_packages="$(python -c 'import site; print(site.getsitepackages()[0])')"
          python scripts/patch_mnn_wheel_execstack.py --site-packages "$site_packages"
          python -c 'import MNN; from MNN.tools import mnnconvert; print("Official MNN converter import: OK")'
      - name: Convert original Fermata weights
        if: steps.weights.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 3.6.1 https://github.com/alibaba/MNN.git "$RUNNER_TEMP/MNN"
          python -m pip install -r "$RUNNER_TEMP/MNN/transformers/llm/export/requirements.txt"
          python -m pip install 'mnn==3.6.1' huggingface_hub tokenizers transformers
          python scripts/prepare_fermata_mnn.py --mnn-source "$RUNNER_TEMP/MNN" --output fermata-conversion
      - name: Preserve converted weights before inference
        if: steps.weights.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            fermata-conversion/mnn
            fermata-conversion/conversion.json
            fermata-conversion/FERMATA_UPSTREAM_README.md
            fermata-conversion/MNN_LICENSE
          key: ${{ steps.weights.outputs.cache-primary-key }}
      - name: Record the original vocabulary structure for the musical decoder
        run: python scripts/report_fermata_vocabulary.py fermata-conversion/mnn/tokenizer/vocab.json >> "$GITHUB_STEP_SUMMARY"
      - name: Run real original-token inference on the build host
        run: |
          python scripts/run_fermata_mnn.py fermata-conversion/mnn --output "$RUNNER_TEMP/fermata-result.json"
          python -c 'import json,sys; p=json.load(open(sys.argv[1])); print("Generated real token count:", len(p["generatedTokenIds"])); print("Seconds:", p["elapsedSeconds"])' "$RUNNER_TEMP/fermata-result.json"
          echo 'Actual host inference completed; this is not Android playback or a music-ready APK.' >> "$GITHUB_STEP_SUMMARY"

  android-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install verified Android SDK and NDK
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/sw-android-sdk"
          mkdir -p "$sdk/cmdline-tools/latest"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/android-cli.zip" "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $RUNNER_TEMP/android-cli.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/android-cli.zip" -d "$RUNNER_TEMP/android-cli"
          mv "$RUNNER_TEMP/android-cli/cmdline-tools/"* "$sdk/cmdline-tools/latest/"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" "ndk;27.2.12479018" "cmake;3.22.1"
          test -f "$sdk/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"
      - name: Build actual Android ARM64 JNI and MNN (no network features)
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.6.1 https://github.com/alibaba/MNN.git "$RUNNER_TEMP/MNN"
          ndk="$ANDROID_HOME/ndk/27.2.12479018"
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" -S native/android/fermata-mnn -B "$RUNNER_TEMP/fermata-arm64" \
            -DMNN_SOURCE="$RUNNER_TEMP/MNN" \
            -DCMAKE_TOOLCHAIN_FILE="$ndk/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-31 \
            -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --build "$RUNNER_TEMP/fermata-arm64" --target soundworld_fermata_mnn --parallel 2
          lib="$RUNNER_TEMP/fermata-arm64/libsoundworld_fermata_mnn.so"
          test -s "$lib"
          "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$lib" | grep -F AArch64
          "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D "$lib" | grep Java_kz_soundworld_ar_SoundWorldFermataPlugin_generateMnnIds
          echo 'Android ARM64 MNN JNI compiled; not yet packaged or run on a phone.' >> "$GITHUB_STEP_SUMMARY"
      - name: Cache the built ARM64 runtime for eventual verified packaging
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/fermata-arm64/libsoundworld_fermata_mnn.so
          key: fermata-arm64-mnn-3.6.1-${{ hashFiles('native/android/fermata-mnn/**') }}

  android-synth:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install verified Android SDK and NDK
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/sw-android-sdk"
          mkdir -p "$sdk/cmdline-tools/latest"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/android-cli.zip" "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $RUNNER_TEMP/android-cli.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/android-cli.zip" -d "$RUNNER_TEMP/android-cli"
          mv "$RUNNER_TEMP/android-cli/cmdline-tools/"* "$sdk/cmdline-tools/latest/"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" "ndk;27.2.12479018" "cmake;3.22.1"
          test -f "$sdk/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"
      - name: Compile the actual Sonivox candidate for Android ARM64
        run: |
          set -euo pipefail
          git clone https://github.com/M-HT/sonivox.git "$RUNNER_TEMP/sonivox"
          git -C "$RUNNER_TEMP/sonivox" checkout --detach d07f6b355fbdfe79d60f0cb9192cbd8a317737e7
          test "$(git -C "$RUNNER_TEMP/sonivox" rev-parse HEAD)" = d07f6b355fbdfe79d60f0cb9192cbd8a317737e7
          test -s "$RUNNER_TEMP/sonivox/LICENSE"
          test -s "$RUNNER_TEMP/sonivox/NOTICE"
          grep -q "Apache License" "$RUNNER_TEMP/sonivox/LICENSE"
          ndk="$ANDROID_HOME/ndk/27.2.12479018"
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" -S native/android/sonivox -B "$RUNNER_TEMP/sonivox-arm64" \
            -DSONIVOX_SOURCE="$RUNNER_TEMP/sonivox" \
            -DCMAKE_TOOLCHAIN_FILE="$ndk/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-31 \
            -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --build "$RUNNER_TEMP/sonivox-arm64" --target soundworld_sonivox --parallel 2
          lib="$RUNNER_TEMP/sonivox-arm64/libsoundworld_sonivox.so"
          test -s "$lib"
          "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$lib" | grep -F AArch64
          "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D "$lib" | grep Java_kz_soundworld_ar_SoundWorldFermataPlugin_renderSonivoxFile
          echo 'Sonivox candidate compiled. Full license review and real audio verification still required; not shipped.' >> "$GITHUB_STEP_SUMMARY"
      - name: Cache the candidate native library for development
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/sonivox-arm64/libsoundworld_sonivox.so
          key: sonivox-candidate-d07f6b3-${{ hashFiles('native/android/sonivox/**') }}

  report:
    if: ${{ always() }}
    needs: [original-tokenizer, convert, android-runtime, android-synth]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Report actual job conclusions to this commit
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          results = json.loads(os.environ["RESULTS"])
          for name, job in results.items():
              result = job["result"]
              state = "success" if result == "success" else "failure" if result == "failure" else "error"
              subprocess.run(["gh", "api", "--method", "POST",
                  f"repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
                  "-f", f"state={state}", "-f", f"context=SoundWorld/Fermata/{name}",
                  "-f", f"description={result}; run {os.environ['GITHUB_RUN_ID']}",
                  "-f", f"target_url={os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"],check=True)
          PY
