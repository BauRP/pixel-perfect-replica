name: Android APK

# Codemagic is the active Android APK builder for pushes to main.
# Keep this GitHub runner workflow only as a manual fallback to prevent
# indefinitely queued Blacksmith jobs and misleading yellow checks.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: soundworld-download-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: kz.soundworld.ar
  APK_NAME: soundworld-ar-debug.apk

jobs:
  build:
    name: Build and publish SoundWorld AR APK
    # The external Blacksmith runner is activated after its GitHub App is
    # authorized for this private repository. No additional project copies.
    # Set repository variable SOUNDWORLD_RUNNER=ubuntu-24.04 only if GitHub
    # hosted Actions allowance is available and you want to switch back.
    runs-on: ${{ vars.SOUNDWORLD_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: bun install

      - name: Verify TypeScript types and important tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest scripts.test_upload_apk_external scripts.test_android_workflow_release_contract
          bunx tsc --noEmit
          bun run test

      - name: Build offline Capacitor SPA
        run: bun run build:android:web

      - name: Verify offline web output before Capacitor sync
        shell: bash
        run: |
          set -euo pipefail
          test -s dist-android/index.html
          test -n "$(find dist-android -type f -name '*.js' -print -quit)"
          test -n "$(find dist-android -type f -name '*.css' -print -quit)"
          grep -q 'id="root"' dist-android/index.html
          echo "SoundWorld Android assets are ready"

      - name: Install verified Android command-line tools
        run: |
          set -euo pipefail
          mkdir -p "$HOME/android-sdk/cmdline-tools/latest"
          curl --fail --location --retry 3 -o /tmp/android-cli.zip "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  /tmp/android-cli.zip" | sha256sum -c -
          unzip -q /tmp/android-cli.zip -d /tmp/android-cli
          mv /tmp/android-cli/cmdline-tools/* "$HOME/android-sdk/cmdline-tools/latest/"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" --licenses >/dev/null || true
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Generate Android host and sync offline assets
        run: |
          npx cap add android
          npx cap sync android
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 31/' android/variables.gradle

      - name: Stage optional verified Fermata/MNN/music assets into Android package
        run: node scripts/validate-offline-music-assets.mjs --stage android/app/src/main

      - name: Install real SoundWorld native sensor plugin
        run: |
          set -euo pipefail
          target=android/app/src/main/java/kz/soundworld/ar
          mkdir -p "$target"
          cp native/android/SoundWorldSensorsPlugin.java "$target/SoundWorldSensorsPlugin.java"
          cp native/android/SoundWorldStepTime.java "$target/SoundWorldStepTime.java"
          cp native/android/SoundWorldMicResampler.java "$target/SoundWorldMicResampler.java"
          cp native/android/SoundWorldCapturePolicy.java "$target/SoundWorldCapturePolicy.java"
          cp native/android/SoundWorldPowerPolicy.java "$target/SoundWorldPowerPolicy.java"
          cp native/android/SoundWorldPowerEpochGuard.java "$target/SoundWorldPowerEpochGuard.java"
          cp native/android/MainActivity.java "$target/MainActivity.java"
          cp native/android/SoundWorldPlaybackService.java "$target/SoundWorldPlaybackService.java"
          cp native/android/SoundWorldPcmLifecyclePolicy.java "$target/SoundWorldPcmLifecyclePolicy.java"
          cp native/android/SoundWorldPlaybackPlugin.java "$target/SoundWorldPlaybackPlugin.java"
          cp native/android/SoundWorldMusicLibraryPlugin.java "$target/SoundWorldMusicLibraryPlugin.java"
          cp native/android/SoundWorldWavExportPolicy.java "$target/SoundWorldWavExportPolicy.java"
          cp native/android/SoundWorldClipRetentionPolicy.java "$target/SoundWorldClipRetentionPolicy.java"
          cp native/android/SoundWorldClipLengthPolicy.java "$target/SoundWorldClipLengthPolicy.java"
          cp native/android/SoundWorldClipPlaybackService.java "$target/SoundWorldClipPlaybackService.java"
          cp native/android/SoundWorldFocusPolicy.java "$target/SoundWorldFocusPolicy.java"
          # Production YAMNet asset is bundled at APK build time (not downloaded by the user).
          mkdir -p android/app/src/main/assets
          curl --fail --location --retry 3 --silent --show-error \
            "https://storage.googleapis.com/mediapipe-models/audio_classifier/yamnet/float32/1/yamnet.tflite" \
            -o android/app/src/main/assets/yamnet.tflite
          test "$(stat -c%s android/app/src/main/assets/yamnet.tflite)" -gt 1000000
          echo "4d8b4a53282dc83ef04e3e7dbc4fbc98082e34e44ed798e16c3a0cdd4c584faf  android/app/src/main/assets/yamnet.tflite" | sha256sum -c -
          cat >> android/app/build.gradle <<'GRADLE'
          dependencies {
              implementation 'com.google.mediapipe:tasks-audio:0.10.35'
          }
          GRADLE
          python3 - <<'PY'
          from pathlib import Path
          path=Path('android/app/src/main/AndroidManifest.xml')
          text=path.read_text()
          for name in ('android.permission.RECORD_AUDIO','android.permission.ACTIVITY_RECOGNITION'):
              if name not in text:
                  text=text.replace('<application',f'<uses-permission android:name="{name}" />\n    <application',1)
          # Actual output only after user Play and genuine PCM; never auto-start on boot.
          text=text.replace('<application', '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <application', 1)
          text=text.replace('</application>', '<service android:name=".SoundWorldPlaybackService" android:exported="false" android:foregroundServiceType="mediaPlayback" />\n    <service android:name=".SoundWorldClipPlaybackService" android:exported="false" android:foregroundServiceType="mediaPlayback" />\n    </application>', 1)
          # Literal backslash-n must never leak into AndroidManifest.xml.
          assert r'\n' not in text, "AndroidManifest contains escaped newline text"
          from xml.etree import ElementTree as ET
          ET.fromstring(text)
          path.write_text(text)
          PY
          # Set display-cutout mode in both Android splash and app themes.
          # On some physical Android 15+ phones the splash is created before
          # MainActivity.onCreate, so a Java-only fix can be too late.
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path("android/app/src/main/res/values/styles.xml")
          tree = ET.parse(path)
          root = tree.getroot()
          changed = []
          for style in root.findall("style"):
              if style.get("name") not in ("AppTheme.NoActionBarLaunch", "AppTheme.NoActionBar"):
                  continue
              item = next((x for x in style.findall("item")
                           if x.get("name") == "android:windowLayoutInDisplayCutoutMode"), None)
              if item is None:
                  item = ET.SubElement(style, "item", {"name": "android:windowLayoutInDisplayCutoutMode"})
              item.text = "always"
              changed.append(style.get("name"))
          assert len(changed) == 2, f"Missing expected Capacitor splash/activity themes: {changed}"
          tree.write(path, encoding="unicode", xml_declaration=True)
          ET.parse(path)
          print("Android splash and Activity cutout mode:", ", ".join(changed))
          PY

      - name: Build shell-only debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          # Maven Central and Google Maven occasionally return missing POMs
          # even for previously published artifacts. Only retry repository
          # download/resolution failures. Java/Kotlin compile errors still fail
          # immediately and are never reported as successful.
          for attempt in 1 2 3; do
            if bash ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/sw-gradle-build.log; then
              exit 0
            fi
            if ! grep -Eq 'Could not find org\.|Could not resolve all artifacts|Could not GET|Read timed out|Connect timed out|HTTP (429|500|502|503|504)' /tmp/sw-gradle-build.log; then
              echo "::error::Gradle failed for a non-download reason"
              exit 1
            fi
            if (( attempt == 3 )); then
              echo "::error::Gradle dependency download still failing after three attempts"
              exit 1
            fi
            echo "::warning::Transient Gradle repository failure; retrying ($attempt/3)"
            sleep $((attempt * 8))
          done

      - name: Verify offline model and supported Android floor in built APK
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -Z -1 "$apk" > /tmp/soundworld-apk-entries.txt
          grep -Fx "assets/yamnet.tflite" /tmp/soundworld-apk-entries.txt
          python3 scripts/verify_android_apk.py "$apk"
      # Actions artifact storage can be exhausted. Releases use a separate
      # delivery path and provide an ordinary APK download link.

      - name: Prepare downloadable APK with checksum
        id: prepare_download
        shell: bash
        run: |
          set -euo pipefail
          source_apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$source_apk"
          mkdir -p output
          install -m 0644 "$source_apk" output/soundworld-ar-debug.apk
          (cd output && sha256sum soundworld-ar-debug.apk > soundworld-ar-debug.apk.sha256)
          test -s output/soundworld-ar-debug.apk.sha256
          echo "Verified APK size: $(stat -c%s output/soundworld-ar-debug.apk) bytes"

      - name: Publish diagnostic APK to GitHub Releases (independent of emulator status)
        id: publish_diagnostic_apk
        # Even a 403 from Releases must not prevent Android startup checks.
        # A final verification step still fails this job if publishing failed.
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Unique run/attempt IDs prevent collisions and preserve older downloads.
          tag="soundworld-ar-build-${{ github.run_id }}-${{ github.run_attempt }}"
          title="SoundWorld AR — диагностическая APK #${{ github.run_number }} (проверка запуска не пройдена)"
          notes="ДИАГНОСТИЧЕСКАЯ APK: работа на Android ещё НЕ подтверждена.
          Может аварийно закрываться. Не считать стабильной версией.
          Android 12+ (minSdk 31). Исходная ветка: ${GITHUB_REF_NAME}.
          Успешны только проверка типов, тесты кода, сборка и проверка пакета.
          Это debug APK: музыкальный ИИ Fermata пока не подключён.
          У разных сборок может быть разная отладочная подпись, поэтому
          обновление поверх уже установленной версии не гарантируется.
          Репозиторий закрыт, скачивание доступно только с доступом к нему.
          Коммит: ${GITHUB_SHA}."
          # Avoid losing a compiled APK when GitHub Releases intermittently
          # returns HTTP 500. Handle a partially-created tag idempotently.
          published=0
          for attempt in 1 2 3 4; do
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" \
                output/soundworld-ar-debug.apk \
                output/soundworld-ar-debug.apk.sha256 --clobber || true
            else
              gh release create "$tag" \
                output/soundworld-ar-debug.apk \
                output/soundworld-ar-debug.apk.sha256 \
                --target "$GITHUB_SHA" \
                --title "$title" \
                --notes "$notes" \
                --prerelease \
                --latest=false || true
            fi
            if asset_names="$(gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null)" \
              && grep -Fxq 'soundworld-ar-debug.apk' <<< "$asset_names" \
              && grep -Fxq 'soundworld-ar-debug.apk.sha256' <<< "$asset_names"; then
              published=1
              break
            fi
            echo "::warning::GitHub Releases attempt $attempt failed"
            if (( attempt < 4 )); then sleep $((attempt * 8)); fi
          done
          if (( published != 1 )); then
            echo "::warning::GitHub Releases unavailable after retries; trying Actions backup"
            exit 1
          fi

          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/soundworld-ar-debug.apk"
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
          sha256="$(cut -d ' ' -f 1 output/soundworld-ar-debug.apk.sha256)"
          {
            echo "## Готовый APK"
            echo
            echo "- [Скачать APK из GitHub Release](${download_url})"
            echo "- [Открыть страницу версии](${release_url})"
            echo
            echo "- **Сборка:** диагностическая APK, Android 12+, запуск ещё не проверен"
            echo "- **SHA-256:** \`${sha256}\`"
            echo "- **Исходный коммит:** \`${GITHUB_SHA:0:12}\`"
            echo "- **ВНИМАНИЕ:** APK может аварийно закрываться. Не считать проверенной до завершения эмулятора."
            echo "- У debug-сборок может отличаться подпись; это не Play Store-релиз."
            echo "- Музыкальная нейросеть Fermata пока не подключена."
          } >> "$GITHUB_STEP_SUMMARY"
      # Upload every compiled APK to the Actions Artifacts section, as in Multi-Cam.
      # Releases remains the independent, longer-lived direct APK download.

      - name: Upload APK to Actions artifacts on every successful build
        id: upload_apk_artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: soundworld-ar-debug-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            output/soundworld-ar-debug.apk
            output/soundworld-ar-debug.apk.sha256
          retention-days: 2
          if-no-files-found: error

      # Same external hosts used in Nova Gallery, as a last resort.
      # APK link is public; app source and repo stay private.
      - name: Upload compiled APK to independent cloud storage
        id: upload_external_apk
        if: steps.prepare_download.outcome == 'success' && steps.publish_diagnostic_apk.outcome != 'success' && steps.upload_apk_artifact.outcome != 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/upload_apk_external.py output/soundworld-ar-debug.apk

      - name: Confirm at least one APK download path succeeded
        if: always() && steps.prepare_download.outcome == 'success' && steps.publish_diagnostic_apk.outcome != 'success' && steps.upload_apk_artifact.outcome != 'success' && steps.upload_external_apk.outcome != 'success'
        shell: bash
        run: |
          echo "::error::No GitHub or external APK delivery path succeeded."
          exit 1

      - name: Show direct APK download link in summary
        if: always() && steps.prepare_download.outcome == 'success' && (steps.publish_diagnostic_apk.outcome == 'success' || steps.upload_apk_artifact.outcome == 'success' || steps.upload_external_apk.outcome == 'success')
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Готовый APK"
            if [[ "${{ steps.publish_diagnostic_apk.outcome }}" == "success" ]]; then
              echo "- [Скачать APK из GitHub Release](https://github.com/$GITHUB_REPOSITORY/releases/download/soundworld-ar-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/soundworld-ar-debug.apk)"
            fi
            if [[ "${{ steps.upload_apk_artifact.outcome }}" == "success" ]]; then
              echo "- [Скачать APK из GitHub Actions Artifacts]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID#artifacts)"
            fi
            if [[ "${{ steps.upload_external_apk.outcome }}" == "success" ]]; then
              echo "- [Скачать APK со стороннего облака](${{ steps.upload_external_apk.outputs.download_url }})"
              echo "- Внешняя ссылка публичная, у временных хостингов срок ограничен."
            fi
            echo "- Android 12+, debug APK; установка на телефон не проверена"
          } >> "$GITHUB_STEP_SUMMARY"
