name: SoundWorld Android native sensors (Phase 2)

# Optional legacy diagnostic workflow: manual only.
# Daily APK builds run from main using android_build.yml.
on:
  workflow_dispatch:
    inputs:
      verify_android_emulators:
        description: "Optional Android 12–16 emulator tests after APK publication"
        type: boolean
        required: false
        default: false

# Keep only the latest build per branch. Older APKs remain in Releases.
concurrency:
  group: soundworld-android-${{ github.ref }}
  cancel-in-progress: true

# Required only for writing the test APK as a GitHub Release.
# The repository stays private; no source code is made public.
permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Validate Android test scripts before expensive emulator setup
        run: |
          bash -n scripts/check_android_startup.sh
          python3 -m unittest scripts.test_ui_accessibility_target scripts.test_ui_measured_onboarding scripts.test_android_lifecycle_contract scripts.test_ui_route_status scripts.test_wav_completion_contract scripts.test_android_workflow_release_contract
      - name: Validate offline music package provenance and size (if supplied)
        run: node scripts/validate-offline-music-assets.mjs
      - name: Validate Android CSS compatibility transform
        run: node --test scripts/legacy-css.test.mjs
      - name: Test offline model ABI and Apache license inventory
        run: node --test scripts/validate-offline-music-assets.test.mjs
      - name: Validate native thermal and battery policy (real Java)
        run: |
          set -euo pipefail
          mkdir -p /tmp/soundworld-power-tests
          javac -d /tmp/soundworld-power-tests \
            native/android/SoundWorldPowerPolicy.java scripts/SoundWorldPowerPolicyTest.java \
            native/android/SoundWorldCapturePolicy.java scripts/SoundWorldCapturePolicyTest.java \
            native/android/SoundWorldStepTime.java scripts/SoundWorldStepTimeTest.java \
            native/android/SoundWorldFocusPolicy.java scripts/SoundWorldFocusPolicyTest.java \
            native/android/SoundWorldClipLengthPolicy.java scripts/SoundWorldClipLengthPolicyTest.java \
            native/android/SoundWorldClipRetentionPolicy.java scripts/SoundWorldClipRetentionPolicyTest.java \
            native/android/SoundWorldPcmLifecyclePolicy.java scripts/SoundWorldPcmLifecyclePolicyTest.java \
            native/android/SoundWorldPowerEpochGuard.java scripts/SoundWorldPowerEpochGuardTest.java \
            native/android/SoundWorldMicResampler.java scripts/SoundWorldMicResamplerTest.java \
            native/android/SoundWorldWavExportPolicy.java scripts/SoundWorldWavExportPolicyTest.java
          java -cp /tmp/soundworld-power-tests kz.soundworld.ar.SoundWorldPowerPolicyTest
          java -cp /tmp/soundworld-power-tests kz.soundworld.ar.SoundWorldCapturePolicyTest
          java -cp /tmp/soundworld-power-tests kz.soundworld.ar.SoundWorldStepTimeTest
          java -cp /tmp/soundworld-power-tests kz.soundworld.ar.SoundWorldFocusPolicyTest
          java -cp /tmp/soundworld-power-tests kz.soundworld.ar.SoundWorldClipLengthPolicyTest
          java -cp /tmp/soundworld-power-tests kz.soundworld.ar.SoundWorldClipRetentionPolicyTest
          java -cp /tmp/soundworld-power-tests kz.soundworld.ar.SoundWorldPcmLifecyclePolicyTest
          java -cp /tmp/soundworld-power-tests kz.soundworld.ar.SoundWorldPowerEpochGuardTest
          java -cp /tmp/soundworld-power-tests kz.soundworld.ar.SoundWorldMicResamplerTest
          java -cp /tmp/soundworld-power-tests kz.soundworld.ar.SoundWorldWavExportPolicyTest
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Web build
        run: npm run build
      - name: Offline Android web build
        run: npm run build:android:web
      - name: Install verified Android command-line tools
        run: |
          set -euo pipefail
          mkdir -p "$HOME/android-sdk/cmdline-tools/latest"
          curl --fail --location --retry 3 -o /tmp/android-cli.zip "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  /tmp/android-cli.zip" | sha256sum -c -
          unzip -q /tmp/android-cli.zip -d /tmp/android-cli
          mv /tmp/android-cli/cmdline-tools/* "$HOME/android-sdk/cmdline-tools/latest/"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" --licenses >/dev/null || true
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Generate Android host and sync offline assets
        run: |
          npx cap add android
          npx cap sync android
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 31/' android/variables.gradle
      - name: Stage optional verified Fermata/MNN/music assets into Android package
        run: node scripts/validate-offline-music-assets.mjs --stage android/app/src/main
      - name: Install real SoundWorld native sensor plugin
        run: |
          set -euo pipefail
          target=android/app/src/main/java/kz/soundworld/ar
          mkdir -p "$target"
          cp native/android/SoundWorldSensorsPlugin.java "$target/SoundWorldSensorsPlugin.java"
          cp native/android/SoundWorldStepTime.java "$target/SoundWorldStepTime.java"
          cp native/android/SoundWorldMicResampler.java "$target/SoundWorldMicResampler.java"
          cp native/android/SoundWorldCapturePolicy.java "$target/SoundWorldCapturePolicy.java"
          cp native/android/SoundWorldPowerPolicy.java "$target/SoundWorldPowerPolicy.java"
          cp native/android/SoundWorldPowerEpochGuard.java "$target/SoundWorldPowerEpochGuard.java"
          cp native/android/MainActivity.java "$target/MainActivity.java"
          cp native/android/SoundWorldPlaybackService.java "$target/SoundWorldPlaybackService.java"
          cp native/android/SoundWorldPcmLifecyclePolicy.java "$target/SoundWorldPcmLifecyclePolicy.java"
          cp native/android/SoundWorldPlaybackPlugin.java "$target/SoundWorldPlaybackPlugin.java"
          cp native/android/SoundWorldMusicLibraryPlugin.java "$target/SoundWorldMusicLibraryPlugin.java"
          cp native/android/SoundWorldWavExportPolicy.java "$target/SoundWorldWavExportPolicy.java"
          cp native/android/SoundWorldClipRetentionPolicy.java "$target/SoundWorldClipRetentionPolicy.java"
          cp native/android/SoundWorldClipLengthPolicy.java "$target/SoundWorldClipLengthPolicy.java"
          cp native/android/SoundWorldClipPlaybackService.java "$target/SoundWorldClipPlaybackService.java"
          cp native/android/SoundWorldFocusPolicy.java "$target/SoundWorldFocusPolicy.java"
          # Production YAMNet asset is bundled at APK build time (not downloaded by the user).
          mkdir -p android/app/src/main/assets
          curl --fail --location --retry 3 --silent --show-error \
            "https://storage.googleapis.com/mediapipe-models/audio_classifier/yamnet/float32/1/yamnet.tflite" \
            -o android/app/src/main/assets/yamnet.tflite
          test "$(stat -c%s android/app/src/main/assets/yamnet.tflite)" -gt 1000000
          echo "4d8b4a53282dc83ef04e3e7dbc4fbc98082e34e44ed798e16c3a0cdd4c584faf  android/app/src/main/assets/yamnet.tflite" | sha256sum -c -
          cat >> android/app/build.gradle <<'GRADLE'
          dependencies {
              implementation 'com.google.mediapipe:tasks-audio:0.10.35'
          }
          GRADLE
          python3 - <<'PY'
          from pathlib import Path
          path=Path('android/app/src/main/AndroidManifest.xml')
          text=path.read_text()
          for name in ('android.permission.RECORD_AUDIO','android.permission.ACTIVITY_RECOGNITION'):
              if name not in text:
                  text=text.replace('<application',f'<uses-permission android:name="{name}" />\n    <application',1)
          # Actual output only after user Play and genuine PCM; never auto-start on boot.
          text=text.replace('<application', '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <application', 1)
          text=text.replace('</application>', '<service android:name=".SoundWorldPlaybackService" android:exported="false" android:foregroundServiceType="mediaPlayback" />\n    <service android:name=".SoundWorldClipPlaybackService" android:exported="false" android:foregroundServiceType="mediaPlayback" />\n    </application>', 1)
          # Literal backslash-n must never leak into AndroidManifest.xml.
          assert r'\n' not in text, "AndroidManifest contains escaped newline text"
          from xml.etree import ElementTree as ET
          ET.fromstring(text)
          path.write_text(text)
          PY
          # Set display-cutout mode in both Android splash and app themes.
          # On some physical Android 15+ phones the splash is created before
          # MainActivity.onCreate, so a Java-only fix can be too late.
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path("android/app/src/main/res/values/styles.xml")
          tree = ET.parse(path)
          root = tree.getroot()
          changed = []
          for style in root.findall("style"):
              if style.get("name") not in ("AppTheme.NoActionBarLaunch", "AppTheme.NoActionBar"):
                  continue
              item = next((x for x in style.findall("item")
                           if x.get("name") == "android:windowLayoutInDisplayCutoutMode"), None)
              if item is None:
                  item = ET.SubElement(style, "item", {"name": "android:windowLayoutInDisplayCutoutMode"})
              item.text = "always"
              changed.append(style.get("name"))
          assert len(changed) == 2, f"Missing expected Capacitor splash/activity themes: {changed}"
          tree.write(path, encoding="unicode", xml_declaration=True)
          ET.parse(path)
          print("Android splash and Activity cutout mode:", ", ".join(changed))
          PY
      - name: Build shell-only debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          # Maven Central and Google Maven occasionally return missing POMs
          # even for previously published artifacts. Only retry repository
          # download/resolution failures. Java/Kotlin compile errors still fail
          # immediately and are never reported as successful.
          for attempt in 1 2 3; do
            if bash ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/sw-gradle-build.log; then
              exit 0
            fi
            if ! grep -Eq 'Could not find org\.|Could not resolve all artifacts|Could not GET|Read timed out|Connect timed out|HTTP (429|500|502|503|504)' /tmp/sw-gradle-build.log; then
              echo "::error::Gradle failed for a non-download reason"
              exit 1
            fi
            if (( attempt == 3 )); then
              echo "::error::Gradle dependency download still failing after three attempts"
              exit 1
            fi
            echo "::warning::Transient Gradle repository failure; retrying ($attempt/3)"
            sleep $((attempt * 8))
          done
      - name: Verify offline model and supported Android floor in built APK
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -Z -1 "$apk" > /tmp/soundworld-apk-entries.txt
          grep -Fx "assets/yamnet.tflite" /tmp/soundworld-apk-entries.txt
          python3 scripts/verify_android_apk.py "$apk"
      # Actions artifact storage can be exhausted. Releases use a separate
      # delivery path and provide an ordinary APK download link.
      - name: Prepare downloadable APK with checksum
        shell: bash
        run: |
          set -euo pipefail
          source_apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$source_apk"
          mkdir -p output
          install -m 0644 "$source_apk" output/soundworld-ar-debug.apk
          (cd output && sha256sum soundworld-ar-debug.apk > soundworld-ar-debug.apk.sha256)
          test -s output/soundworld-ar-debug.apk.sha256
          echo "Verified APK size: $(stat -c%s output/soundworld-ar-debug.apk) bytes"

      - name: Publish diagnostic APK to GitHub Releases (independent of emulator status)
        id: publish_diagnostic_apk
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/publish_apk_release.sh

      # Publish the diagnostic debug APK without expensive emulators on push.
      # Emulator checks are an OPTIONAL manually requested acceptance, not unfinished code.
      - name: Reclaim GitHub runner disk space for Android emulator
        if: github.event_name == 'workflow_dispatch' && inputs.verify_android_emulators
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk space before cleanup:"
          df -h .
          # Android has already been compiled. The unused preinstalled
          # .NET/PowerShell/Haskell toolchains are unrelated to SoundWorld.
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/ghc
          echo "Disk space after cleanup:"
          df -h .
          # Fail explicitly rather than wait for an emulator boot timeout.
          python3 - <<'PY'
          import shutil
          free=shutil.disk_usage(".").free
          print(f"Emulator free space: {free/1024**3:.2f} GiB")
          assert free >= 10 * 1024**3, "Not enough free storage for Android emulator"
          PY
      - name: Enable KVM for Android emulator
        if: github.event_name == 'workflow_dispatch' && inputs.verify_android_emulators
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify actual Android 12 startup twice (crash gate)
        if: github.event_name == 'workflow_dispatch' && inputs.verify_android_emulators
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disk-size: 2048M
          ram-size: 4096M
          emulator-boot-timeout: 360
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -cores 4
          script: bash scripts/check_android_startup.sh
      - name: Reclaim emulator disk after Android 31
        if: always() && github.event_name == 'workflow_dispatch' && inputs.verify_android_emulators
        shell: bash
        run: |
          set -euo pipefail
          # Remove runner-local emulator caches, never the compiled APK.
          adb kill-server || true
          rm -rf "$HOME/.android/avd/test.avd" "$HOME/.android/avd/test.ini"
          rm -rf "$ANDROID_SDK_ROOT/system-images/android-31"
          rm -rf "$ANDROID_SDK_ROOT/.temp"
          df -h .
          python3 - <<'PY'
          import shutil
          free=shutil.disk_usage(".").free
          print(f"Free disk before next emulator: {free/1024**3:.2f} GiB")
          if free < 8 * 1024**3:
            raise SystemExit("Runner disk too full for next emulator; APK build succeeded")
          PY
      - name: Verify Android 13 startup and screens (API 33)
        if: github.event_name == 'workflow_dispatch' && inputs.verify_android_emulators
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_4
          disk-size: 2048M
          ram-size: 4096M
          emulator-boot-timeout: 360
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -cores 4
          script: bash scripts/check_android_startup.sh
      - name: Reclaim emulator disk after Android 33
        if: always() && github.event_name == 'workflow_dispatch' && inputs.verify_android_emulators
        shell: bash
        run: |
          set -euo pipefail
          # Remove runner-local emulator caches, never the compiled APK.
          adb kill-server || true
          rm -rf "$HOME/.android/avd/test.avd" "$HOME/.android/avd/test.ini"
          rm -rf "$ANDROID_SDK_ROOT/system-images/android-33"
          rm -rf "$ANDROID_SDK_ROOT/.temp"
          df -h .
          python3 - <<'PY'
          import shutil
          free=shutil.disk_usage(".").free
          print(f"Free disk before next emulator: {free/1024**3:.2f} GiB")
          if free < 8 * 1024**3:
            raise SystemExit("Runner disk too full for next emulator; APK build succeeded")
          PY
      - name: Verify Android 14 startup and screens (API 34)
        if: github.event_name == 'workflow_dispatch' && inputs.verify_android_emulators
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_4
          disk-size: 2048M
          ram-size: 4096M
          emulator-boot-timeout: 360
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -cores 4
          script: bash scripts/check_android_startup.sh
      - name: Reclaim emulator disk after Android 34
        if: always() && github.event_name == 'workflow_dispatch' && inputs.verify_android_emulators
        shell: bash
        run: |
          set -euo pipefail
          adb kill-server || true
          rm -rf "$HOME/.android/avd/test.avd" "$HOME/.android/avd/test.ini"
          rm -rf "$ANDROID_SDK_ROOT/system-images/android-34"
          rm -rf "$ANDROID_SDK_ROOT/.temp"
          df -h .
          python3 - <<'PY'
          import shutil
          free=shutil.disk_usage(".").free
          print(f"Free disk before next emulator: {free/1024**3:.2f} GiB")
          if free < 8 * 1024**3:
            raise SystemExit("Runner disk too full for next emulator; APK build succeeded")
          PY
      - name: Verify Android 15 edge-to-edge and screen cutout (API 35)
        if: github.event_name == 'workflow_dispatch' && inputs.verify_android_emulators
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disk-size: 2048M
          ram-size: 3072M
          emulator-boot-timeout: 360
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash scripts/check_android_startup.sh
      - name: Reclaim emulator disk after Android 35
        if: always() && github.event_name == 'workflow_dispatch' && inputs.verify_android_emulators
        shell: bash
        run: |
          set -euo pipefail
          # Remove runner-local emulator caches, never the compiled APK.
          adb kill-server || true
          rm -rf "$HOME/.android/avd/test.avd" "$HOME/.android/avd/test.ini"
          rm -rf "$ANDROID_SDK_ROOT/system-images/android-35"
          rm -rf "$ANDROID_SDK_ROOT/.temp"
          df -h .
          python3 - <<'PY'
          import shutil
          free=shutil.disk_usage(".").free
          print(f"Free disk before next emulator: {free/1024**3:.2f} GiB")
          if free < 8 * 1024**3:
            raise SystemExit("Runner disk too full for next emulator; APK build succeeded")
          PY
      - name: Verify actual Android 16 startup and screens (API 36)
        if: github.event_name == 'workflow_dispatch' && inputs.verify_android_emulators
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disk-size: 2048M
          ram-size: 3072M
          emulator-boot-timeout: 360
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash scripts/check_android_startup.sh
      - name: Mark APK verified only after optional Android 12–16 launch tests
        if: github.event_name == 'workflow_dispatch' && inputs.verify_android_emulators && steps.publish_diagnostic_apk.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="soundworld-ar-build-${{ github.run_id }}-${{ github.run_attempt }}"
          # Metadata publication is best-effort AFTER all optional emulator gates.
          # Do not turn a verified APK into a red Android job because GitHub's
          # Releases API temporarily returns HTTP 500 for release edits.
          marked=0
          for attempt in 1 2 3; do
            if gh release edit "$tag" \
              --title "SoundWorld AR — APK #${{ github.run_number }} (Android 12, 13, 14, 15 и 16 проверены)" \
              --notes "Автоматические тесты, компиляция и проверка запуска Android 12, 13, 14, 15 и 16 пройдены. APK отладочная, не Play Store; поведение на других телефонах не гарантируется. Музыкальная нейросеть Fermata пока не подключена. Коммит: ${GITHUB_SHA}."; then
              marked=1
              break
            fi
            echo "::warning::Release metadata update attempt $attempt failed"
            if (( attempt < 3 )); then sleep $((attempt * 8)); fi
          done
          if (( marked == 0 )); then
            echo "::warning::Android tests passed, but GitHub did not update the diagnostic release label; inspect the workflow run before using the APK."
          fi
          echo "### ✅ Проверка запуска Android 12, 13, 14, 15 и 16 пройдена" >> "$GITHUB_STEP_SUMMARY"
