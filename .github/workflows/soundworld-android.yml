name: SoundWorld Android shell (Phase 2)

on:
  push:
    branches: [chatgpt/soundworld-phase2-android-20261108]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Web build
        run: npm run build
      - name: Offline Android web build
        run: npm run build:android:web
      - name: Install Android SDK (runner preinstalls command-line tools)
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Generate Android host and sync offline assets
        run: |
          npx cap add android
          npx cap sync android
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 31/' android/variables.gradle
      - name: Build shell-only debug APK
        working-directory: android
        run: bash ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: soundworld-phase2-shell-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
